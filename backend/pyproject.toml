[project]
name = "quantlab"
version = "0.1.0"
description = "QuantLab API, worker, numerical engine, research workflow, and sentiment service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.2",
    "alembic==1.20.0",
    "psycopg[binary,pool]==3.3.6",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "boto3==1.43.107",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Only the worker image installs the model stack; the API image stays small.
ml = [
    "transformers==5.18.0",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "moto[s3]==5.2.3",
    "ruff==0.16.10",
]

[project.scripts]
quantlab = "quantlab.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a real PostgreSQL server (TEST_DATABASE_URL)",
    "model: downloads and runs the real FinBERT model (run explicitly)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make the package look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's template style and long SQL constraints.
"alembic/versions/*" = ["E501", "UP007", "UP035", "I001"]
